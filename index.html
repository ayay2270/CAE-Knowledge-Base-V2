<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAE Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E3A8A'/%3E%3Cpath d='M16 6l8.7 5v10L16 26l-8.7-5V11z' fill='none' stroke='%23FACC15' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0F172A; --navy:#1E3A8A; --blue:#2563EB; --yellow:#FACC15; --green:#10B981; --orange:#F97316; --red:#EF4444;
  --hm:#F4511E; --hm-ink:#D63F10; --hm-bg:rgba(244,81,30,.09); --hm-ph:#FDE9E2;
  --ls:#0E8C8C; --ls-ink:#0B7373; --ls-bg:rgba(14,140,140,.1); --ls-ph:#DDF1F1;
  --bg:#F3F5F9; --panel:#fff; --line:#E3E7EF; --line2:#CBD2DE;
  --text:#172033; --text2:#556079; --text3:#8A93A8;
  --font:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.link{color:var(--blue);font-weight:500}

/* 頂部 */
header.top{height:58px;background:var(--navy);display:flex;align-items:center;gap:16px;padding:0 20px;color:#fff;position:relative}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;white-space:nowrap;letter-spacing:.01em}
.brand i{color:var(--yellow);font-size:23px}
.search{flex:1;max-width:680px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border-radius:10px;padding:0 12px;height:38px;transition:background .15s,color .15s}
.search i{font-size:17px}
.search:focus-within{background:#fff;color:var(--text)}
.search input{flex:1;border:none;background:none;outline:none;color:inherit;font-size:14px;min-width:0}
.search input::placeholder{color:rgba(255,255,255,.72)}
.search:focus-within input::placeholder{color:var(--text3)}
.kbd{font-size:11px;border:1px solid currentColor;opacity:.55;border-radius:5px;padding:1px 6px;font-family:var(--mono);white-space:nowrap}
.btn-new{display:flex;align-items:center;gap:6px;background:var(--yellow);color:var(--navy);font-weight:600;border-radius:10px;padding:0 16px;height:38px;white-space:nowrap}
.btn-new:hover{background:#FDE047}
.btn-new i{font-size:18px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
header .icon-btn:hover{background:rgba(255,255,255,.12)}
.spacer{flex:1}
.strip{display:flex;height:5px}.strip span{flex:1}
.menu{position:absolute;right:16px;top:54px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(15,23,42,.18);padding:6px;min-width:210px;z-index:60;color:var(--text)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;text-align:left;font-size:13px}
.menu button i{font-size:17px;color:var(--text2)}
.menu button:hover{background:var(--bg)}
.menu .who{font-size:12px;color:var(--text3);padding:6px 10px 9px;border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}

/* 三欄 */
main.layout{display:grid;grid-template-columns:230px 370px minmax(0,1fr);height:calc(100vh - 63px)}
.col{overflow:auto}
aside.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;font-size:14px;color:var(--text2);text-align:left;margin-bottom:2px}
.nav:hover{background:var(--bg)}
.nav img{width:22px;height:22px;object-fit:contain;flex:none}
.nav > i{font-size:21px;width:22px;text-align:center}
.nav .n{margin-left:auto;font-size:12px;color:var(--text3);font-family:var(--mono)}
.nav.sub{padding:7px 11px 7px 43px;font-size:13px}
.nav.on{background:var(--bg);color:var(--text);font-weight:600}
.nav.on.hm{background:var(--hm-bg);color:var(--hm-ink)}
.nav.on.ls{background:var(--ls-bg);color:var(--ls-ink)}
.nav.on .n{color:inherit}
.side-sec{font-size:12px;color:var(--text3);padding:18px 11px 6px}

section.list{background:var(--bg);border-right:1px solid var(--line);padding:12px}
.list-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:4px 6px 10px;font-size:13px;color:var(--text2);min-height:38px}
.list-head .count{font-weight:600;color:var(--text)}
.list-head select{margin-left:auto;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:4px 8px;font-size:12px;cursor:pointer}
.filter-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(37,99,235,.12);color:var(--blue);border-radius:6px;padding:2px 4px 2px 8px;font-size:12px;font-weight:500}
.filter-chip button{display:flex;font-size:14px}
.item{display:flex;gap:12px;padding:10px;border-radius:12px;border:1.5px solid transparent;margin-bottom:4px;width:100%;text-align:left;transition:background .12s}
.item:hover{background:#fff}
.item.on{background:#fff;border-color:var(--hm)}
.item.on.ls{border-color:var(--ls)}
.thumb{width:62px;height:62px;border-radius:9px;flex:none;background:var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.ph.hm{background:var(--hm-ph)} .thumb.ph.ls{background:var(--ls-ph)}
.thumb.ph img{width:30px;height:30px;object-fit:contain}
.item .cat{font-size:12px;font-weight:600}
.item .t{font-size:14px;font-weight:600;margin:2px 0 3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--text3)}
.empty{text-align:center;color:var(--text3);padding:56px 20px;font-size:13px;line-height:1.7}
.empty i{font-size:36px;display:block;margin-bottom:8px;color:var(--line2)}
.empty b{display:block;color:var(--text2);font-size:15px;margin-bottom:2px}
.empty .btn{margin-top:14px}

section.detail{background:#fff;padding:26px 36px 70px}
.detail-inner{max-width:840px}
.d-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{color:#fff;font-size:12px;font-weight:600;border-radius:7px;padding:4px 10px}
.pill.hm{background:var(--hm)} .pill.ls{background:var(--ls)}
.d-date{font-size:13px;color:var(--text3)}
.d-actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;border:1px solid var(--line2);background:#fff;white-space:nowrap}
.btn i{font-size:17px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1D4ED8}
.btn.danger{color:#DC2626;border-color:#FCA5A5}
.btn.danger:hover{background:#FEF2F2}
.btn:disabled{opacity:.6;cursor:wait}
h1.d-title{font-size:26px;font-weight:600;margin:12px 0 10px;line-height:1.35;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.tag{font-size:12px;font-weight:500;border-radius:6px;padding:3px 9px;background:rgba(37,99,235,.1);color:var(--blue)}
button.tag:hover{background:rgba(37,99,235,.2)}
.gallery-main{width:100%;border-radius:14px;background:var(--ink);overflow:hidden;cursor:zoom-in;display:block;aspect-ratio:16/9;max-height:440px}
.gallery-main img{width:100%;height:100%;object-fit:contain;display:block}
.gallery-row{display:flex;gap:8px;margin:8px 0 28px;flex-wrap:wrap}
.gallery-row button{width:80px;height:54px;border-radius:8px;overflow:hidden;background:var(--ink);border:2px solid transparent}
.gallery-row button.on{border-color:var(--yellow)}
.gallery-row img{width:100%;height:100%;object-fit:cover;display:block}
.gap{height:28px}
.step{display:flex;gap:14px;margin-bottom:20px}
.num{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
.num i{font-size:16px}
.step h3{font-size:13px;font-weight:600;margin:4px 0 4px}
.prose{font-size:15px;line-height:1.75;word-wrap:break-word}
.prose p{margin:0 0 8px} .prose p:last-child,.prose ul:last-child{margin-bottom:0}
.prose ul{margin:0 0 8px;padding-left:20px}
.prose code{font-family:var(--mono);font-size:.87em;background:rgba(15,23,42,.07);padding:1px 5px;border-radius:4px}
.solution{flex:1;min-width:0;background:var(--green);color:#fff;border-radius:12px;padding:12px 16px}
.solution h3{color:#fff;margin-top:0}
.solution .prose code{background:rgba(255,255,255,.22)}
.solution .pending{color:rgba(255,255,255,.8)}
.extras{margin-left:42px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.extra{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65}
.extra h4{font-size:13px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:5px}
.extra.fail{background:rgba(239,68,68,.08)} .extra.fail h4{color:#DC2626}
.extra.fail ul{margin:0;padding-left:18px;color:var(--text2)}
.extra.note{background:rgba(250,204,21,.17)} .extra.note h4{color:#B45309}
.extra.full{grid-column:1/-1}
.pending{color:var(--text3);font-style:italic;font-size:14px}

/* 編輯頁 */
section.editor{background:#fff;height:calc(100vh - 63px);overflow:auto}
.ed-bar{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:5;display:flex;align-items:center;gap:14px;padding:12px 32px;border-bottom:1px solid var(--line)}
.ed-bar .back{color:var(--text2);display:flex;align-items:center;gap:5px;font-size:13px}
.ed-bar .back:hover{color:var(--text)}
.ed-bar strong{font-size:16px;font-weight:600}
.ed-status{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:5px}
.ed-status.ok{color:var(--green)}
.ed-body{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:36px;padding:26px 32px 70px;max-width:1240px}
.field{margin-bottom:22px}
.lab{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px}
.req{color:var(--red)}
.inp{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:#fff}
.inp:focus,.tagbox:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.inp.title{font-size:18px;font-weight:600}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.ferr{color:#DC2626;font-size:12px;margin-top:5px}
.cats{display:flex;gap:8px}
.cc{flex:1;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;color:var(--text2);background:#fff;text-align:left}
.cc:hover{border-color:var(--line2)}
.cc img{width:24px;height:24px;object-fit:contain;flex:none}
.cc small{display:block;font-size:11px;color:var(--text3);font-weight:400}
.cc.on.hm{border-color:var(--hm);background:var(--hm-bg);color:var(--hm-ink);font-weight:600}
.cc.on.ls{border-color:var(--ls);background:var(--ls-bg);color:var(--ls-ink);font-weight:600}
.tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:7px 9px;cursor:text}
.tagbox input{border:none;outline:none;flex:1;min-width:140px;font-size:13px;padding:3px;background:none}
.tagbox .tag{display:inline-flex;align-items:center;gap:3px}
.tagbox .tag button{display:flex;font-size:13px;opacity:.7}
.tagbox .tag button:hover{opacity:1}
.sugg{font-size:12px;color:var(--text3);margin-top:7px;min-height:18px}
.sugg button{color:var(--blue);margin-right:8px;font-size:12px}
.sugg button:hover{text-decoration:underline}
.box{flex:1;min-width:0;border:1.5px solid;border-radius:12px;overflow:hidden}
.box-h{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;font-size:13px;font-weight:600}
.tb{margin-left:auto;display:flex;gap:2px}
.tb button{width:28px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px}
.tb button:hover{background:rgba(15,23,42,.1)}
.box.sol .tb button:hover{background:rgba(255,255,255,.22)}
.box textarea{width:100%;border:none;outline:none;resize:vertical;padding:10px 12px;font-size:14px;line-height:1.65;min-height:88px;display:block;background:#fff}
.ed-extras{margin-left:42px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.xbox{border:1.5px dashed;border-radius:12px;padding:11px 13px}
.xbox h4{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:5px}
.fail-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.fail-row .dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.fail-row input{flex:1;min-width:0;border:none;border-bottom:1px solid var(--line);outline:none;padding:4px 2px;font-size:13px;background:transparent}
.fail-row input:focus{border-bottom-color:var(--red)}
.fail-row button{color:var(--text3);display:flex;font-size:15px}
.fail-row button:hover{color:#DC2626}
.add-fail{font-size:13px;color:#DC2626;font-weight:500;display:inline-flex;align-items:center;gap:3px;margin-top:2px}
.xbox textarea{width:100%;border:none;outline:none;background:transparent;resize:vertical;font-size:13px;min-height:78px;line-height:1.6}
.drop{border:2px dashed var(--blue);background:rgba(37,99,235,.05);border-radius:14px;padding:26px 14px;text-align:center;cursor:pointer;transition:background .15s;width:100%}
.drop:hover,.drop.over{background:rgba(37,99,235,.13)}
.drop i{font-size:30px;color:var(--blue)}
.drop b{display:block;color:var(--blue);font-size:14px;margin-top:4px;font-weight:600}
.drop small{color:var(--text3);font-size:12px}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.im{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--ink);border:2px solid transparent}
.im.cover{border-color:var(--yellow)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im .badge{position:absolute;left:5px;top:5px;background:var(--yellow);color:var(--navy);font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px}
.im .ops{position:absolute;right:4px;top:4px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.im:hover .ops,.im:focus-within .ops{opacity:1}
.im .ops button{width:28px;height:28px;border-radius:7px;background:rgba(15,23,42,.78);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.im .ops button:hover{background:var(--ink)}
.hint{font-size:12px;color:var(--text3);margin-top:8px;line-height:1.6}
.ed-side{position:sticky;top:84px;align-self:start}
.ed-foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}

/* 設定／登入 */
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--navy)}
.screen .brand{color:#fff;margin-bottom:18px;font-size:18px}
.card{background:#fff;border-radius:18px;padding:30px;width:100%;max-width:430px}
.card h2{margin:0 0 6px;font-size:20px;font-weight:600}
.card p{color:var(--text2);font-size:13px;line-height:1.65;margin:0 0 20px}
.card .field{margin-bottom:14px}
.card .btn.primary{width:100%;height:42px;margin-top:6px;font-size:14px}
.err{color:#DC2626;font-size:13px;margin-top:10px;min-height:18px;line-height:1.5}
.card .foot{margin-top:16px;font-size:12px;color:var(--text3);text-align:center}
.screen .strip{width:100%;max-width:430px;border-radius:0 0 4px 4px;overflow:hidden}

/* 放大圖 */
.lb{position:fixed;inset:0;background:rgba(8,12,26,.93);z-index:100;display:flex;align-items:center;justify-content:center}
.lb img{max-width:92vw;max-height:88vh;border-radius:8px}
.lb button{position:absolute;color:#fff;font-size:26px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.lb button:hover{background:rgba(255,255,255,.2)}
.lb .x{top:18px;right:18px}.lb .prev{left:18px}.lb .next{right:18px}
.lb .cnt{position:absolute;bottom:18px;color:#fff;font-size:13px;opacity:.7}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.toast.bad{background:#B91C1C}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text3);padding:50px 0;font-size:13px}
.spin{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
@media (max-width:1150px){
  main.layout{grid-template-columns:200px 310px minmax(0,1fr)}
  section.detail{padding:22px 24px 60px}
  .ed-body{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   設定：可以直接把 Supabase 的 URL 和 publishable key 填在這裡。
   留空的話，第一次打開網站時會在畫面上請你輸入（存在瀏覽器裡）。
   ============================================================ */
const CONFIG = { url: '', key: '' };

/* ---------- 啟動 ---------- */
function getConfig() {
  if (CONFIG.url && CONFIG.key) return CONFIG;
  try { const c = JSON.parse(localStorage.getItem('kb-config') || 'null'); if (c && c.url && c.key) return c; } catch (e) {}
  return null;
}

async function boot() {
  if (!window.supabase) {
    $('#root').innerHTML = `<div class="screen"><div class="card"><h2>載入失敗</h2><p>無法載入 Supabase 套件，請確認網路連線後重新整理。</p></div></div>`;
    return;
  }
  const cfg = getConfig();
  if (!cfg) return showSetup();
  sb = window.supabase.createClient(cfg.url, cfg.key);
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) return showLogin();
    user = data.session.user;
    showApp();
  } catch (e) {
    showLogin();
  }
}

function brandHtml() { return `<div class="brand"><i class="ti ti-hexagons"></i>CAE Knowledge Base</div>`; }

function showSetup(msg = '') {
  $('#root').innerHTML = `<div class="screen">${brandHtml()}<div class="card">
    <h2>連接 Supabase</h2>
    <p>第一次使用，請貼上 Supabase 專案的 Project URL 和 publishable key（舊版叫 anon key）。這兩個值只會存在這台電腦的瀏覽器裡。</p>
    <div class="field"><label class="lab" for="cfgUrl">Project URL</label><input class="inp" id="cfgUrl" placeholder="https://abcdefgh.supabase.co" autocomplete="off"></div>
    <div class="field"><label class="lab" for="cfgKey">Publishable key</label><input class="inp" id="cfgKey" placeholder="sb_publishable_… 或 eyJ…" autocomplete="off"></div>
    <button class="btn primary" id="cfgGo">連線</button>
    <div class="err" id="cfgErr">${esc(msg)}</div>
    <div class="foot">請不要貼 secret key 或 service_role key</div>
  </div>${STRIP}</div>`;
  const go = () => {
    const url = $('#cfgUrl').value.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/+$/, '');
    const key = $('#cfgKey').value.trim();
    if (!/^https:\/\/\S+$/.test(url)) return $('#cfgErr').textContent = 'Project URL 應該以 https:// 開頭。';
    if (key.length < 20) return $('#cfgErr').textContent = '金鑰看起來不完整，請整串複製。';
    if (/^sb_secret_/.test(key) || /service_role/.test(atobSafe(key))) return $('#cfgErr').textContent = '這是 secret key，不能放在網頁上。請改貼 publishable key（或 anon key）。';
    localStorage.setItem('kb-config', JSON.stringify({ url, key }));
    boot();
  };
  $('#cfgGo').onclick = go;
  $('#cfgKey').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function atobSafe(k) { try { return atob(k.split('.')[1] || ''); } catch (e) { return ''; } }

function showLogin() {
  $('#root').innerHTML = `<div class="screen">${brandHtml()}<div class="card">
    <h2>登入</h2>
    <p>使用你在 Supabase 建立的帳號登入。</p>
    <div class="field"><label class="lab" for="lgEmail">Email</label><input class="inp" id="lgEmail" type="email" autocomplete="username"></div>
    <div class="field"><label class="lab" for="lgPw">密碼</label><input class="inp" id="lgPw" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="lgGo">登入</button>
    <div class="err" id="lgErr"></div>
    <div class="foot"><button class="link" id="lgReset">重新設定 Supabase 連線</button></div>
  </div>${STRIP}</div>`;
  const go = async () => {
    const email = $('#lgEmail').value.trim(), password = $('#lgPw').value;
    if (!email || !password) return $('#lgErr').textContent = '請輸入 Email 和密碼。';
    const btn = $('#lgGo'); btn.disabled = true; btn.textContent = '登入中…'; $('#lgErr').textContent = '';
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      user = data.user; showApp();
    } catch (err) {
      const m = err.message || '';
      $('#lgErr').textContent = /invalid login/i.test(m) ? 'Email 或密碼錯誤。'
        : /api key|apikey|jwt/i.test(m) ? '金鑰不正確，請按下方「重新設定 Supabase 連線」。'
        : /fetch|network/i.test(m) ? '連不到 Supabase，請確認 Project URL 是否正確，或專案是否被暫停。'
        : /not confirmed/i.test(m) ? '這個帳號還沒確認。請到 Supabase 的 Users 頁面確認帳號。'
        : '登入失敗：' + m;
      btn.disabled = false; btn.textContent = '登入';
    }
  };
  $('#lgGo').onclick = go;
  $('#lgPw').onkeydown = e => { if (e.key === 'Enter') go(); };

async function loadEntries() {
  $('#list').innerHTML = `<div class="loading"><div class="spin"></div>載入中…</div>`;
  $('#detail').innerHTML = '';
  renderSide();
  const { data, error } = await sb.from('entries').select('*').order('updated_at', { ascending: false });
  if (error) {
    const m = error.message || '';
    if (/jwt|expired|not authenticated/i.test(m)) { await sb.auth.signOut(); return showLogin(); }
    $('#list').innerHTML = emptyHtml('ti-database-off',
      /does not exist|schema cache|relation/i.test(m) ? '找不到資料表' : '讀取失敗',
      /does not exist|schema cache|relation/i.test(m) ? '請先到 Supabase 的 SQL Editor 執行 setup.sql，再重新整理。' : esc(m));
    return;
  }
  S.entries = data || [];
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && S.entries.some(e => e.id === h)) S.sel = h;
  renderSide(); renderList(true);
  if (S.sel) renderDetail(true);
}

/* ---------- 篩選與搜尋 ---------- */
function inFilter(e, f = S.filter) {
  if (f === 'all') return true;
  if (f === 'hm') return (CATS[e.category] || {}).group === 'hm';
  return e.category === f;
}
function terms(q) {
  q = (q || '').toLowerCase().trim();
  if (!q) return [];
  const parts = q.split(/[\s,;:()\[\]{}"'=<>|\/\\*!?。，、：；（）]+/)
    .filter(t => (t.length >= 2 || /[\u4e00-\u9fff]/.test(t)) && !/^[\d.+\-e]+$/.test(t));
  return [...new Set(parts)].slice(0, 40);
}
function hay(e) {
  return [e.title, (e.tags || []).join(' '), e.symptom, e.root_cause, e.solution, (e.failed_attempts || []).join(' '), e.notes].join('\n').toLowerCase();
}
function visible() {
  let arr = S.entries.filter(e => inFilter(e));
  if (S.tag) arr = arr.filter(e => (e.tags || []).includes(S.tag));
  const ts = terms(S.q);
  if (ts.length) {
    const need = ts.length <= 3 ? ts.length : Math.max(2, Math.ceil(ts.length * 0.25));
    return arr.map(e => {
      const h = hay(e), ti = (e.title || '').toLowerCase();
      let s = 0, hit = 0;
      for (const x of ts) if (h.includes(x)) { hit++; s += ti.includes(x) ? 3 : 1; }
      return { e, s, hit };
    }).filter(o => o.hit >= need).sort((a, b) => b.s - a.s).map(o => o.e);
  }
  const sorters = {
    new: (a, b) => new Date(b.updated_at) - new Date(a.updated_at),
    views: (a, b) => (b.views || 0) - (a.views || 0),
    title: (a, b) => (a.title || '').localeCompare(b.title || '', 'zh-Hant')
  };
  return arr.sort(sorters[S.sort]);
}

/* ---------- 側欄 ---------- */
function renderSide() {
  const count = k => S.entries.filter(e => inFilter(e, k)).length;
  const nav = (k, label, icon, cls = '', sub = false) =>

  $('#side').innerHTML =
    nav('all', '全部', '<i class="ti ti-books"></i>') +
    `<div class="side-sec">軟體</div>` +

/* ---------- 詳情 ---------- */
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function md(src) {
  if (!src || !src.trim()) return '';
  let out = '', list = null, para = [];
  const flushP = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const flushL = () => { if (list) { out += '<ul>' + list.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'; list = null; } };
  for (const ln of esc(src).split('\n')) {
    const m = ln.match(/^\s*[-*•]\s+(.*)$/);
    if (m) { flushP(); (list = list || []).push(m[1]); }
    else if (!ln.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(ln); }
  }
  flushP(); flushL();
  return out;
}

  el.innerHTML = `<div class="detail-inner">

      <div class="d-actions"><button class="btn" data-act="copylink" title="複製連結" aria-label="複製連結"><i class="ti ti-link"></i></button>
      <button class="btn primary" data-act="edit"><i class="ti ti-edit"></i>編輯</button></div></div>
    <h1 class="d-title">${esc(e.title)}</h1>
    ${(e.tags || []).length ? `<div class="tags">${e.tags.map(t => `<button class="tag" data-act="dtag" data-t="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : '<div class="gap" style="height:12px"></div>'}
    ${gallery}

    <div class="step"><div class="num" style="background:var(--green)"><i class="ti ti-check"></i></div>

/* ---------- 圖片 ---------- */
const urlCache = new Map();
async function signUrls(paths) {
  const now = Date.now();
  const need = paths.filter(p => { const c = urlCache.get(p); return !c || c.exp < now + 120000; });
  for (let i = 0; i < need.length; i += 100) {
    const chunk = need.slice(i, i + 100);
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(chunk, 3600);
    if (!error && data) data.forEach(d => { if (d.signedUrl) urlCache.set(d.path, { url: d.signedUrl, exp: now + 3600e3 }); });
  }
}
async function hydrate(root) {
  const imgs = $$('img[data-path]', root);
  if (!imgs.length) return;
  await signUrls([...new Set(imgs.map(i => i.dataset.path))]);
  imgs.forEach(i => { const c = urlCache.get(i.dataset.path); if (c) i.src = c.url; });
}
function openLightbox(paths, start) {
  let i = start;
  const lb = document.createElement('div');
  lb.className = 'lb';
  const draw = () => {
    lb.innerHTML = `<img src="${esc(urlCache.get(paths[i])?.url || '')}" alt="">
      <button class="x" aria-label="關閉"><i class="ti ti-x"></i></button>
      ${paths.length > 1 ? `<button class="prev" aria-label="上一張"><i class="ti ti-chevron-left"></i></button><button class="next" aria-label="下一張"><i class="ti ti-chevron-right"></i></button>` : ''}
      <div class="cnt">${i + 1} / ${paths.length}</div>`;
  };
  const close = () => { lb.remove(); document.removeEventListener('keydown', key); };
  const move = d => { i = (i + d + paths.length) % paths.length; draw(); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1); };
  lb.addEventListener('click', e => {
    if (e.target.closest('.x') || e.target === lb) close();
    else if (e.target.closest('.prev')) move(-1);
    else if (e.target.closest('.next')) move(1);
  });
  document.addEventListener('keydown', key);
  draw();
  document.body.appendChild(lb);
}
async function prepImage(file) {
  const MAX = 2400;
  try {
    const bmp = await createImageBitmap(file);
    const big = Math.max(bmp.width, bmp.height) > MAX;
    if (!big && file.size < 1.5e6) return file;
    const sc = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
    return blob ? new File([blob], 'image.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}

function loadDraft() {

  } catch (e) {}
  return null;
}
let draftT;
function touch() {
  ED.dirty = true;
  if (ED.id) return;
  clearTimeout(draftT);
  draftT = setTimeout(() => {
    const { title, category, tags, symptom, root_cause, solution, failed, notes } = ED;

function applyMd(ta, kind) {
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  if (kind === 'list') {
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const block = v.slice(ls, e);
    const nb = block.split('\n').map(l => /^\s*[-*•]\s/.test(l) ? l : '- ' + l).join('\n');
    ta.value = v.slice(0, ls) + nb + v.slice(e);
    ta.setSelectionRange(ls + nb.length, ls + nb.length);
  } else {
    const w = kind === 'bold' ? '**' : '`';
    const inner = v.slice(s, e) || (kind === 'bold' ? '重點' : 'parameter');
    ta.value = v.slice(0, s) + w + inner + w + v.slice(e);
    ta.setSelectionRange(s + w.length, s + w.length + inner.length);
  }
  ta.focus();
  ta.dispatchEvent(new Event('input'));
}

async function save() {
  if ($('#saveBtn')?.disabled) return;
  const pending = $('#tagIn')?.value; if (pending) { addTag(pending); $('#tagIn').value = ''; }
  ED.title = ED.title.trim();
  if (!ED.title) {
    $('#edTitle').classList.add('bad'); $('#titleErr').classList.remove('hidden'); $('#edTitle').focus();
    return;
  }
  const btn = $('#saveBtn');
  btn.disabled = true; btn.innerHTML = '<div class="spin" style="width:14px;height:14px;border-color:rgba(255,255,255,.4);border-top-color:#fff"></div>儲存中…';
  try {
    const images = [];
    for (const im of ED.images) {
      if (!im.path) {
        const ext = ({ 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp' })[im.file.type] || 'png';
        const path = `${user.id}/${crypto.randomUUID()}.${ext}`;
        const { error } = await sb.storage.from(BUCKET).upload(path, im.file, { contentType: im.file.type || 'image/png', upsert: false });
        if (error) throw new Error('圖片上傳失敗：' + error.message);
        im.path = path;
      }
      images.push({ path: im.path });
    }
    const row = {
      title: ED.title, category: ED.category, tags: ED.tags,
      symptom: ED.symptom.trim(), root_cause: ED.root_cause.trim(), solution: ED.solution.trim(),
      failed_attempts: ED.failed.map(s => s.trim()).filter(Boolean), notes: ED.notes.trim(), images
    };
    const res = ED.id
      ? await sb.from('entries').update(row).eq('id', ED.id).select().single()
      : await sb.from('entries').insert(row).select().single();
    if (res.error) throw new Error('儲存失敗：' + res.error.message);
    if (ED.removed.length) await sb.storage.from(BUCKET).remove(ED.removed);
    const saved = res.data;
    const idx = S.entries.findIndex(x => x.id === saved.id);
    if (idx >= 0) S.entries[idx] = saved; else S.entries.unshift(saved);
    if (!ED.id) localStorage.removeItem(DRAFT_KEY);
    closeEditor();
    S.sel = saved.id; S.q = ''; $('#q').value = '';
    if (S.tag && !(saved.tags || []).includes(S.tag)) S.tag = null;
    if (!inFilter(saved)) S.filter = 'all';
    history.replaceState(null, '', '#' + saved.id);
    renderSide(); renderList(false); renderDetail(true);
    $(`#list .item[data-id="${saved.id}"]`)?.scrollIntoView({ block: 'nearest' });
    toast('已儲存');
  } catch (err) {
    toast(err.message || '儲存失敗', true);
    btn.disabled = false; btn.innerHTML = '<i class="ti ti-device-floppy"></i>儲存';
  }
}

async function deleteEntry() {
  if (!confirm('確定要刪除這筆知識嗎？圖片也會一起刪除，無法復原。')) return;
  const e = S.entries.find(x => x.id === ED.id);
  const { error } = await sb.from('entries').delete().eq('id', ED.id);
  if (error) return toast('刪除失敗：' + error.message, true);
  const paths = [...(e?.images || []).map(i => i.path), ...ED.removed];
  if (paths.length) await sb.storage.from(BUCKET).remove(paths);
  S.entries = S.entries.filter(x => x.id !== ED.id);
  S.sel = null;
  closeEditor();
  history.replaceState(null, '', location.pathname);
  renderSide(); renderList(true);
  toast('已刪除');
}

function cancelEdit() {
  if (ED.dirty && !confirm(ED.id ? '有尚未儲存的修改，確定要離開嗎？' : '確定要離開嗎？這份草稿會被捨棄。')) return;
  if (!ED.id) localStorage.removeItem(DRAFT_KEY);
  closeEditor();
}

/* ---------- 其他 ---------- */
let toastT;
function toast(msg, bad) {
  $('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastT);
  toastT = setTimeout(() => t.remove(), bad ? 5000 : 2200);
}
function exportBackup() {
  const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), entries: S.entries }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `cae-kb-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已匯出文字資料（圖片仍存放在 Supabase）');
}

/* ---------- 事件 ---------- */
const actions = {
  filter: b => { S.filter = b.dataset.f; S.tag = null; renderSide(); renderList(true); },
  select: b => select(b.dataset.id),
  untag: () => { S.tag = null; renderList(true); },
  dtag: b => { S.tag = b.dataset.t; S.q = ''; $('#q').value = ''; renderList(false); },
  gi: b => { S.gi = +b.dataset.i; renderDetail(false); },
  zoom: () => { const e = S.entries.find(x => x.id === S.sel); if (e) openLightbox(e.images.map(i => i.path), Math.min(S.gi, e.images.length - 1)); },
  copylink: () => { navigator.clipboard?.writeText(location.href).then(() => toast('已複製連結'), () => toast('無法複製，請手動複製網址列', true)); },
  new: () => openEditor(null),
  edit: () => openEditor(S.sel),
  cancel: cancelEdit,
  save: save,
  delete: deleteEntry,
  discard: () => { localStorage.removeItem(DRAFT_KEY); closeEditor(); openEditor(null); },
  cat: b => { ED.category = b.dataset.c; $$('#editor .cc').forEach(x => x.classList.toggle('on', x === b)); touch(); },
  rmtag: b => { ED.tags.splice(+b.dataset.i, 1); renderTags(); renderSugg(); touch(); },
  sugg: b => { addTag(b.dataset.t); renderSugg(); },
  addfail: () => addFail(),
  rmfail: b => { ED.failed.splice(+b.dataset.i, 1); if (!ED.failed.length) ED.failed = ['']; renderFails(); touch(); },
  md: b => applyMd($(`#editor textarea[data-f="${b.dataset.f}"]`), b.dataset.k),
  pick: () => $('#fileIn').click(),
  cover: b => { const [im] = ED.images.splice(+b.dataset.i, 1); ED.images.unshift(im); renderImgs(); touch(); },
  rmimg: b => {
    const [im] = ED.images.splice(+b.dataset.i, 1);
    if (im.path) ED.removed.push(im.path);
    if (im.url) URL.revokeObjectURL(im.url);
    renderImgs(); touch();
  },
  menu: () => $('#menu').classList.toggle('hidden'),
  reload: () => { $('#menu').classList.add('hidden'); loadEntries(); },
  export: () => { $('#menu').classList.add('hidden'); exportBackup(); },
  reset: resetConfig,
  logout: async () => { await sb.auth.signOut(); S.entries = []; S.sel = null; showLogin(); }
};
document.addEventListener('click', e => {
  const menu = $('#menu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('#menu') && !e.target.closest('[data-act="menu"]')) menu.classList.add('hidden');
  const a = e.target.closest('[data-act]');
  if (a && actions[a.dataset.act]) { e.preventDefault(); actions[a.dataset.act](a, e); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && $('#q') && !ED) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's' && ED) { e.preventDefault(); save(); }
});
document.addEventListener('paste', e => {
  if (!ED) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); addFiles(files); }
});
window.addEventListener('beforeunload', e => { if (ED && ED.dirty && ED.id) { e.preventDefault(); e.returnValue = ''; } });

boot();
</script>
